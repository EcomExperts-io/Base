name: Theme Review

# Installed by .claude/scripts/pull-base-tooling.py. Do not add steps here: the review logic lives in
# EcomExperts-io/Base/.github/workflows/theme-review.yml and this file only calls it, so a fix lands everywhere with one PR.
#
# No branch filter on purpose: client trunks are `Main`, `Develop` or a ticket name, and GitHub matches filters case-sensitively.
#
# If Base is made private: allow organisation workflows under its Settings > Actions > Access, and add a read-only PAT as
# the BASE_READ_TOKEN secret, or the drift report step is skipped (the gates still run).

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    uses: EcomExperts-io/Base/.github/workflows/theme-review.yml@development
    secrets: inherit
