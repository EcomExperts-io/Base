name: Theme Review

# Installed by .claude/scripts/pull-base-tooling.py. Do not add steps here.
#
# The review logic lives in Base — EcomExperts-io/Base/.github/workflows/
# theme-review.yml — and this file only calls it, so every client repo runs the
# same checks and a fix to a check lands everywhere with one PR to Base.
#
# No branch filter on purpose: client trunks are `Main`, `Develop` or a
# ticket-named project branch, and GitHub matches branch filters
# case-sensitively, so a filter on Base's branch names would never fire.
#
# Requirements, once per organisation:
#   * While Base is public its reusable workflow can be called with nothing to
#     configure. If Base is made private, its Settings > Actions > "Access"
#     must allow workflows from repositories in the organisation.
#   * The drift report checks Base out. If Base goes private, add a read-only
#     PAT as the BASE_READ_TOKEN secret; without it that one step is skipped
#     and the gates still run.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    uses: EcomExperts-io/Base/.github/workflows/theme-review.yml@development
    secrets: inherit
