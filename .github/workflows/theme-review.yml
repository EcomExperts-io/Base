name: Theme Review

# Every blocking check in .githooks/pre-commit, run on the pull request where
# there is no --no-verify, plus whole-theme reports. Reusable via `workflow_call`
# from a client repo's caller (.claude/templates/fork-theme-review.yml).

on:
  pull_request:
    branches: [development, main]
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: theme-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    env:
      # The CLI is interactive and phones home by default; both are noise or a
      # hang in CI. Theme Check itself needs no store and no authentication.
      SHOPIFY_CLI_NO_ANALYTICS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history. The section contract check diffs against the base
          # branch, so base.sha has to be a real object in this clone.
          fetch-depth: 0

      - name: Checkout Base (scripts fallback and drift report)
        if: ${{ !cancelled() }}
        id: base
        # BASE_READ_TOKEN is only needed while Base is private; without it this
        # checkout fails and the steps that need it are skipped.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: EcomExperts-io/Base
          ref: development
          path: .base-tooling
          token: ${{ secrets.BASE_READ_TOKEN || github.token }}

      - name: Locate the scripts
        if: ${{ !cancelled() }}
        # A fork that has pulled Base's tooling runs its own copy; one without
        # .claude/ falls back to Base's.
        run: |
          if [ -d .claude/scripts ]; then
            echo "SCRIPTS=.claude/scripts" >> "$GITHUB_ENV"
            echo "Scripts: this repository's own .claude/scripts"
          elif [ -d .base-tooling/.claude/scripts ]; then
            echo "SCRIPTS=.base-tooling/.claude/scripts" >> "$GITHUB_ENV"
            echo "::warning::No .claude/scripts in this repo — running Base's. Run pull-base-tooling.py to get your own copy."
          else
            echo "::error::No scripts available: this repo has no .claude/scripts and Base could not be checked out."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20: the Shopify CLI imports `enableCompileCache` from
          # node:module, which does not exist before Node 22, and
          # check-theme-staged.py treats a CLI that cannot start as a skip.
          node-version: 22

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli

      # Each check below carries `if: ${{ !cancelled() }}` so one failure does
      # not hide the others; a failed step still fails the job.

      - name: Theme Check (whole theme, report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        # The .base-tooling/ checkout is ignored by Base's config; a fork
        # without .theme-check.yml sees Base's files in this report only.
        run: |
          if [ -f .theme-check.yml ]; then
            shopify theme check --config=.theme-check.yml || true
          else
            shopify theme check || true
          fi

      - name: Conventions (whole theme, report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 "${SCRIPTS}/check-conventions.py" --all || true

      - name: Theme Check (blocking, files this PR touches)
        if: ${{ !cancelled() }}
        env:
          # Inside a workflow_call, github.event.pull_request is the CALLER's
          # event, so this is the client PR's base.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Gates on the diff, not the whole theme. The script reads `git diff
        # --cached`, which is empty on a PR checkout: `reset --soft <base>` moves
        # HEAD only, so the index then reads base..head; HEAD is put back after.
        run: |
          set -eu

          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags --quiet origin "${BASE_SHA}"

          ORIG_HEAD="$(git rev-parse HEAD)"
          git reset --soft "${BASE_SHA}"

          # check-theme-staged.py returns 0 silently when nothing is staged, so
          # an index this step failed to populate would pass vacuously.
          staged_count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          echo "Theme Check scope: ${staged_count} file(s) changed by this PR"
          if [ "${staged_count}" -eq 0 ]; then
            echo "::error::index is empty after reset --soft; the check would pass vacuously"
            git reset --soft "${ORIG_HEAD}"
            exit 1
          fi

          set +e
          python3 "${SCRIPTS}/check-theme-staged.py"
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "Theme Check: no errors in the files this PR touches"
          fi

          git reset --soft "${ORIG_HEAD}"
          exit "${status}"

      - name: Section settings contract and conventions (blocking on files this PR adds)
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Both scripts read the git INDEX, which is empty on a runner. `git reset --soft <base>` moves HEAD only, so
        # the index then reads base..head and --diff-filter=A lists the sections this PR ADDS; HEAD is put back after.
        # The "COMMIT BLOCKED" banner is shared with the hook and left as is.
        run: |
          set -eu

          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags --quiet origin "${BASE_SHA}"

          ORIG_HEAD="$(git rev-parse HEAD)"
          git reset --soft "${BASE_SHA}"

          # The scripts return 0 silently when nothing is added; print the scope
          # so a broken reset is distinguishable from a clean PR in the log.
          added="$(git diff --cached --name-only --diff-filter=A | grep -c '^sections/' || true)"
          echo "Section contract scope: ${added} section(s) added by this PR"

          set +e
          python3 "${SCRIPTS}/check-section-contract.py"
          contract=$?
          python3 "${SCRIPTS}/check-conventions.py" --staged
          conventions=$?
          set -e

          git reset --soft "${ORIG_HEAD}"
          [ "${contract}" -eq 0 ] && [ "${conventions}" -eq 0 ]

      - name: The checks check themselves
        if: ${{ !cancelled() && hashFiles('.claude/scripts/test-checks.py') != '' }}
        run: python3 "${SCRIPTS}/test-checks.py"

      - name: Rule cross-references
        if: ${{ !cancelled() && hashFiles('.claude/rules/*.md') != '' }}
        # --all, not the hook's staged scope: a fork's inherited breakage is
        # only ever seen here.
        run: python3 "${SCRIPTS}/check-rule-links.py" --all

      - name: AI config is structurally sound
        if: ${{ !cancelled() && hashFiles('.claude/rules/*.md') != '' }}
        run: python3 "${SCRIPTS}/check-ai-config.py" --verbose

      - name: Docs Liquid examples do not break the VitePress build
        if: ${{ !cancelled() && hashFiles('docs/**/*.md') != '' }}
        run: python3 "${SCRIPTS}/check-docs-interpolation.py"

      - name: AI config mirror is in sync
        if: ${{ !cancelled() && hashFiles('.claude/rules/*.md') != '' }}
        # --check writes nothing and exits 1 if the mirror has drifted from
        # .claude/. The pre-commit hook regenerates the mirror, so this can only
        # fail on a commit made with --no-verify.
        run: sh "${SCRIPTS}/sync-ai-config.sh" --check

      - name: Tooling drift against Base
        if: ${{ !cancelled() && steps.base.outcome == 'success' && hashFiles('.base-version') != '' }}
        continue-on-error: true
        # Report only: rules this repo edited since it last pulled Base
        # (harvest candidates) and rules Base changed since (pull-down candidates).
        run: python3 "${SCRIPTS}/check-tooling-drift.py" --base-path .base-tooling --no-fetch
